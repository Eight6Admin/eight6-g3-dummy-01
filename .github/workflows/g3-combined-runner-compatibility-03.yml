name: G3 combined patched process compatibility 03
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: g3-combined-compatibility-03
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Materialise BASELINE_RUNTIME.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          b=base64.b64decode('',validate=True)
          assert hashlib.sha256(b).hexdigest().upper()=='E23B3AD50B9177B53BF8AAA5C4E656F8A3CED74AE38AD0A048B1B005B9D9F1F0'
          p=Path('BASELINE_RUNTIME.json')
          with p.open('xb') as f:f.write(b)
          p.chmod(0o400)
          PY
      - name: Materialise combined_runner.py
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          b=base64.b64decode('',validate=True)
          assert hashlib.sha256(b).hexdigest().upper()=='8DA0E378A7F7FD1C43154282C71EE29824A8EDBCC0D8EBA2C868F09EA7FE3374'
          p=Path('combined_runner.py')
          with p.open('xb') as f:f.write(b)
          p.chmod(0o400)
          PY
      - name: One credential-free combined observation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/env -i PATH=/usr/bin:/bin GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_ACTOR="$GITHUB_ACTOR" GITHUB_REF="$GITHUB_REF" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" /usr/bin/python3 -I combined_runner.py
