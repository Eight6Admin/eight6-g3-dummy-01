           if entrypoint:cmd+=['--entrypoint',entrypoint]
           _,out,_=docker(work,cmd+[IMAGE]+args,'CREATE_'+stage)
           cid=out.decode('ascii').strip();need(re.fullmatch('[0-9a-f]{64}',cid) is not None and cidfile.read_text().strip()==cid,'CID_BINDING')
           _,out,_=docker(work,['inspect',cid],'INSPECT_'+stage);rows=loads(out);need(len(rows)==1,'CONTAINER_SHAPE');container_identity(rows[0],work,stage,runid,uid,gid)
           start_failure=None
