          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/fresh_attempt_guard.py" | /usr/bin/cut -d ' ' -f 1)" = 'c5182712da3485d705840dc4e81f7bdc4948eb4b693034b6f3cbf6c21134da13'
      - name: Materialise exact maintained_probe.py
        shell: bash
        run: |
