             return d
            return json.loads(data,object_pairs_hook=pairs)
           return {'runs':get(root+'/actions/runs?per_page=100',True),'commit':get(root+'/commits/main',True),'base':get(raw+BASE_COMMIT+'/'+WORKFLOW_PATH,False),'current':get(raw+e['GITHUB_SHA']+'/'+WORKFLOW_PATH,False)}
          def verify(e,script_path):
           previous=signal.signal(signal.SIGALRM,lambda *_:(_ for _ in ()).throw(GuardStop('EVIDENCE_DEADLINE')))
           signal.setitimer(signal.ITIMER_REAL,60)
           try:
            result=validate(e,acquire(e),Path(script_path).read_bytes(),Path(__file__).read_bytes(),Path(script_path).with_name('copy_diagnostics.py').read_bytes())
            print('FRESH_DIAGNOSTIC_GUARD='+json.dumps(result,sort_keys=True,separators=(',',':')),flush=True)
           except BaseException as exc:
            code=str(exc) if isinstance(exc,GuardStop) else 'GITHUB_EVIDENCE_UNAVAILABLE_OR_MALFORMED'
            print('FRESH_DIAGNOSTIC_GUARD='+json.dumps({'status':'STOP','attempt':ATTEMPT,'code':code,'no_retry':True},sort_keys=True,separators=(',',':')),flush=True)
            raise GuardStop(code) from None
           finally:signal.setitimer(signal.ITIMER_REAL,0);signal.signal(signal.SIGALRM,previous)
