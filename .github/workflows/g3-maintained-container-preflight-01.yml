               else:sel.unregister(key.fileobj)
             rc=p.wait(timeout=max(.01,end-time.monotonic()))
            out,err=bytes(streams[p.stdout]),bytes(streams[p.stderr])
            event={'stage':stage,'exit':rc,'stdout_bytes':len(out),'stderr_bytes':len(err),'stderr_sha256':hashlib.sha256(err).hexdigest().upper(),'error_categories':diagnostics(err+out) if rc else [],'error_words':[w.decode('ascii') for w in error_words(err)] if rc else [],'raw_output_not_logged':True}
            EVENTS.append(event)
