name: G3 maintained Skopeo local copy 01
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: g3-maintained-container-test-01
  cancel-in-progress: false
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Materialise exact approved-policy.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/env -i PATH=/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 -I - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          b=base64.b64decode('ewogICAgImRlZmF1bHQiOiBbCiAgICAgICAgewogICAgICAgICAgICAidHlwZSI6ICJpbnNlY3VyZUFjY2VwdEFueXRoaW5nIgogICAgICAgIH0KICAgIF0KfQo=',validate=True)
          assert hashlib.sha256(b).hexdigest().upper()=='E7B7D97048A60F2E26943F2E307CAA6F2000E5836CC1C7CF48FF74452521F084'
          p=Path(os.environ['RUNNER_TEMP'])/'approved-policy.json'
          with p.open('xb') as f:f.write(b)
          p.chmod(0o400)
          PY
      - name: Materialise exact copy_diagnostics.py
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/copy_diagnostics.py" <<'E6_COPY_DIAGNOSTICS'
          """Finite container-only diagnostics. No subprocesses, credentials or network."""
          import hashlib,re,json
          WORDS=set('time level fatal error warning msg initializing source destination oci archive creating temp temporary directory unpacking opening reading writing extracting copying blob manifest config image getting signatures storing list signature trying reuse using read only read-only file system permission denied operation not permitted no such or not found failed invalid unexpected end of input mkdir stat open lstat readlink rename remove unlink chmod chown untar tar extract argument unknown flag unsupported network is unreachable connection refused cannot allocate memory out space device resource busy exists success false true info debug sha256 verified EOF'.lower().split())
          PATH=re.compile(r'/[^\s\"\'<>:,;()]*')
          SAFE_PATH=re.compile(r'(?:/input/(?:frozen\.oci\.tar|policy\.json|empty\.json)|/output(?:/copied(?:/[a-zA-Z0-9_.-]+)*|/container_images_[a-zA-Z0-9_.-]+(?:/[a-zA-Z0-9_.-]+)*)?|/tmp|/var/tmp)')
          def state(row):
           s=row['State']
           if type(s.get('Running')) is not bool or type(s.get('OOMKilled')) is not bool or type(s.get('Error')) is not str:raise ValueError('STATE_TYPES')
           status=s.get('Status');code=s.get('ExitCode')
           if status not in {'created','running','paused','restarting','removing','exited','dead'} or type(code) is not int or not -255<=code<=255:raise ValueError('STATE_SHAPE')
           terminated=not s['Running'] and status in {'exited','dead'}
           return {'status':status,'running':s['Running'],'termination_observed':terminated,'exit_code':code if terminated else None,'oom_killed':s['OOMKilled'],'runtime_error_present':bool(s.get('Error'))}
          def capture(raw):
           result={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest().upper(),'limit':4096,'complete':False,'sanitized_text':None}
           if len(raw)>4096:result['withheld']='OUTPUT_BOUND';return result
           try:text=raw.decode('utf-8')
           except UnicodeError:result['withheld']='ENCODING';return result
           if any(ord(c)<32 and c not in '\n\r\t' for c in text) or any(ord(c)>126 for c in text):result['withheld']='CONTROL_OR_NONASCII';return result
           if re.search(r'(?i)token|password|secret|bearer|authorization|https?://|gh[pousr]_|github_pat_|bwsm_',text):result['withheld']='SENSITIVE_MARKER';return result
           def words(s):return re.sub(r'[A-Za-z_][A-Za-z_0-9.-]*',lambda m:m.group() if m.group().lower() in WORDS else '[REDACTED_WORD]',s)
           parts=[];end=0
           for m in PATH.finditer(text):
            parts.append(words(text[end:m.start()]));value=m.group()
            safe=SAFE_PATH.fullmatch(value) is not None and '..' not in value.split('/')
            parts.append(value if safe else '[REDACTED_PATH]');end=m.end()
           parts.append(words(text[end:]));text=''.join(parts)
           if len(json.dumps(text,ensure_ascii=True).encode('ascii'))>4096:result['withheld']='SANITIZED_OUTPUT_BOUND';return result
           result.update(complete=True,sanitized_text=text,redacted='[REDACTED_' in text)
           return result
          E6_COPY_DIAGNOSTICS
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/copy_diagnostics.py" | /usr/bin/cut -d ' ' -f 1)" = 'f8830f324eba463201f8f3bb5a9e42c7d7821a209ae97288d878e62bb85d0eeb'
      - name: Materialise exact fresh_attempt_guard.py
        shell: bash
        run: |
