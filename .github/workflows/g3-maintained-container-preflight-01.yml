            with op.open(req,timeout=10) as r:
             require(r.status==200,'EVIDENCE_HTTP_STATUS');data=r.read(1048577);require(len(data)<=1048576,'EVIDENCE_OUTPUT_BOUND')
             require('Link' not in r.headers,'EVIDENCE_PAGINATION')
            if not parsed:return data
