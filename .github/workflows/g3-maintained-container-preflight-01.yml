            capture={'source':'CID-targeted docker logs; may include client/daemon messages; all text sanitized','available':lr==0}
            if lr==0:capture.update(stdout=d['capture'](lo),stderr=d['capture'](le))
            print('COPY_CONTAINER_OUTPUT='+json.dumps(capture,sort_keys=True,separators=(',',':')),flush=True)
            need(lr==0,'COPY_LOG_EVIDENCE_UNAVAILABLE')
            need(capture['stdout']['complete'] and capture['stderr']['complete'],'COPY_DIAGNOSTIC_INCOMPLETE')
