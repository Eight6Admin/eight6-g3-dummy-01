          umask 077
          cat > "$RUNNER_TEMP/fresh_attempt_guard.py" <<'E6_FRESH_GUARD'
          """Inactive, credential-free public-evidence guard. No execution authority."""
          import hashlib,json,re,signal,urllib.request
          from pathlib import Path
          
          BASE_COMMIT='97c2c619f0ec06ad64326ecc70f788637e6f7f99'
          BASE_WORKFLOW_SHA='23C2C7C28EFAAFFF597EA035E4D8B148056E0156E66167B56F3C41E926A09680'
          BASE_SCRIPT_SHA='41789386810C414FDE90612767A9E9B3A7901C6381FEB12A92C6CB4BCD855651'
          BASE_GUARD_SHA='32A3CDF6B8B9EEDED9545B10DE896BDE8106B3E5CEA9C700A0E1DCB0EC035FBE'
          WORKFLOW_PATH='.github/workflows/g3-maintained-container-preflight-01.yml'
          ATTEMPT='PHASE3C2_MAINTAINED_LOCALCOPY_04'
          BASE_RUNS=[{'id': 42384470925, 'workflow_id': 410282391, 'run_number': 3, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'failure', 'head_sha': '97c2c619f0ec06ad64326ecc70f788637e6f7f99', 'head_branch': 'main', 'path': '.github/workflows/g3-maintained-container-preflight-01.yml'}, {'id': 42378955656, 'workflow_id': 410282391, 'run_number': 2, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'failure', 'head_sha': '00c92e3f5b30be8ea341e4f06559378e0036f1a0', 'head_branch': 'main', 'path': '.github/workflows/g3-maintained-container-preflight-01.yml'}, {'id': 42371938487, 'workflow_id': 410282391, 'run_number': 1, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'failure', 'head_sha': '5f47b13c8fb322f7000d3c229c75bb1743332cc5', 'head_branch': 'main', 'path': '.github/workflows/g3-maintained-container-preflight-01.yml'}, {'id': 42364340065, 'workflow_id': 410213436, 'run_number': 1, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'failure', 'head_sha': 'f2105cc619cb2989c7f241ed4f65a26c5dfe94dc', 'head_branch': 'main', 'path': '.github/workflows/g3-combined-runner-compatibility-03.yml'}, {'id': 42356506998, 'workflow_id': 410179626, 'run_number': 1, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'failure', 'head_sha': '6bdacaaef952e17f4fe0fe43ea261513b90ef1e8', 'head_branch': 'main', 'path': '.github/workflows/g3-ghcr-runner-preflight-02.yml'}, {'id': 42308022727, 'workflow_id': 409838027, 'run_number': 1, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'failure', 'head_sha': '4ebd4cb5c745030e99a58999a1981f14f7139f8f', 'head_branch': 'main', 'path': '.github/workflows/g3-ghcr-publish-01.yml'}, {'id': 42256553478, 'workflow_id': 409566888, 'run_number': 1, 'run_attempt': 1, 'event': 'workflow_dispatch', 'status': 'completed', 'conclusion': 'success', 'head_sha': '455ea9e230470938f1f3318f6f2a8588b5e3c514', 'head_branch': 'main', 'path': '.github/workflows/g3-ghcr-tool-preflight-01.yml'}]
          class GuardStop(Exception):pass
          def require(ok,code):
           if not ok:raise GuardStop(code)
          def sha(raw):return hashlib.sha256(raw).hexdigest().upper()
          def project(row):
           return {k:row[k] for k in ('id','workflow_id','run_number','run_attempt','event','status','conclusion','head_sha','head_branch','path')}
          def reconstruct(base,script,guard,diagnostic):
           text=base.decode('utf-8')
           def replace_file(name,marker,expected,new):
            nonlocal text
            start='          cat > "$RUNNER_TEMP/'+name+'" <<\''+marker+'\'\n'
            end='          '+marker+'\n'
            require(text.count(start)==1 and text.count(end)==1,'BASE_SOURCE_SHAPE')
            embedded=text.split(start,1)[1].split(end,1)[0]
            require(all(line.startswith('          ') for line in embedded.splitlines()),'BASE_SOURCE_INDENT')
            old=''.join(line[10:]+'\n' for line in embedded.splitlines()).encode()
            require(sha(old)==expected,'BASE_EMBEDDED_HASH')
            checksum='test "$(/usr/bin/sha256sum "$RUNNER_TEMP/'+name+'" | /usr/bin/cut -d \' \' -f 1)" = \''+expected.lower()+'\''
            require(text.count(checksum)==1,'BASE_MATERIALISATION_HASH')
            body=''.join('          '+line+'\n' for line in new.decode('utf-8').splitlines())
            text=text.replace(start+embedded+end,start+body+end).replace(checksum,checksum.replace(expected.lower(),sha(new).lower()))
           replace_file('maintained_probe.py','E6_MAINTAINED_PROBE',BASE_SCRIPT_SHA,script)
           replace_file('fresh_attempt_guard.py','E6_FRESH_GUARD',BASE_GUARD_SHA,guard)
           step='      - name: Materialise exact copy_diagnostics.py\n        shell: bash\n        run: |\n          set -euo pipefail\n          umask 077\n          cat > "$RUNNER_TEMP/copy_diagnostics.py" <<\'E6_COPY_DIAGNOSTICS\'\n'
           step+=''.join('          '+line+'\n' for line in diagnostic.decode('utf-8').splitlines())
           step+='          E6_COPY_DIAGNOSTICS\n          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/copy_diagnostics.py" | /usr/bin/cut -d \' \' -f 1)" = \''+sha(diagnostic).lower()+'\'\n'
           anchor='      - name: Materialise exact fresh_attempt_guard.py\n'
           require(text.count(anchor)==1,'DIAGNOSTIC_STEP_SCOPE');text=text.replace(anchor,step+anchor)
           return text.encode()
          def validate(e,evidence,script,guard,diagnostic):
           require(e.get('GITHUB_RUN_NUMBER')=='4' and e.get('GITHUB_RUN_ATTEMPT')=='1','FRESH_NOT_RERUN')
           require(e.get('GITHUB_REPOSITORY')=='Eight6Admin/eight6-g3-dummy-01' and e.get('GITHUB_ACTOR')=='Eight6Admin' and e.get('GITHUB_EVENT_NAME')=='workflow_dispatch' and e.get('GITHUB_REF')=='refs/heads/main','FRESH_CONTEXT')
           revision=e.get('GITHUB_SHA','');runid=e.get('GITHUB_RUN_ID','')
