           require(sorted(old,key=lambda r:r['id'])==sorted(BASE_RUNS,key=lambda r:r['id']),'HISTORICAL_RUN_CHANGED')
           row=current[0]
           require(row['workflow_id']==410282391 and row['run_number']==4 and row['run_attempt']==1 and row['event']=='workflow_dispatch' and row['status']=='in_progress' and row['conclusion'] is None and row['head_sha']==revision and row['head_branch']=='main' and row['path']==WORKFLOW_PATH and row['actor']['login']=='Eight6Admin' and row['triggering_actor']['login']=='Eight6Admin' and row['repository']['full_name']=='Eight6Admin/eight6-g3-dummy-01','CURRENT_RUN_BINDING')
           commit=evidence['commit']
           require(commit['sha']==revision and [p['sha'] for p in commit['parents']]==[BASE_COMMIT],'SOURCE_PARENT')
           require(len(commit['files'])==1 and commit['files'][0]['filename']==WORKFLOW_PATH and commit['files'][0]['status']=='modified','SOURCE_CHANGE_SCOPE')
           require(sha(evidence['base'])==BASE_WORKFLOW_SHA,'BASE_WORKFLOW_HASH')
           require(evidence['current']==reconstruct(evidence['base'],script,guard,diagnostic),'CURRENT_WORKFLOW_BYTES')
           return {'attempt':ATTEMPT,'status':'FRESH_GUARD_PASS','run_id':runid,'head_sha':revision,'historical_run1':42371938487,'historical_run1_status':'FAILED / NOT ACCEPTED / CONSUMED','workflow_sha256':sha(evidence['current']),'script_sha256':sha(script),'guard_sha256':sha(guard),'diagnostic_sha256':sha(diagnostic),'history_count':len(rows),'scope':'Fresh-history/source guard only; Founder execution approval remains external and mandatory'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
