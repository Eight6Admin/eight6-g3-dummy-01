           require(set(evidence)=={'runs','commit','base','current'},'EVIDENCE_INVENTORY')
           runs=evidence['runs'];rows=runs['workflow_runs']
           require(runs['total_count']==len(rows)==len(BASE_RUNS)+1 and len({r['id'] for r in rows})==len(rows),'UNEXPECTED_OR_INCOMPLETE_HISTORY')
           current=[r for r in rows if str(r['id'])==runid]
           require(len(current)==1 and int(runid) not in {r['id'] for r in BASE_RUNS},'FRESH_RUN_ID')
