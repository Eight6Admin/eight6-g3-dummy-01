          def diagnostics(raw):
           # Finite classified messages only: never emit arbitrary tool output or argv.
           text=raw.lower();rules={'PERMISSION_DENIED':[b'permission denied'],'OPERATION_NOT_PERMITTED':[b'operation not permitted'],'NAMESPACE_OR_CHROOT':[b'unshare',b'namespace',b'chroot'],'POLICY_REJECTION':[b'rejected by policy',b'source image rejected'],'MISSING_FILE':[b'no such file',b'not found'],'INVALID_IMAGE':[b'invalid image',b'invalid manifest',b'invalid tar',b'unrecognized image'],'DIGEST_MISMATCH':[b'digest mismatch',b'digest verification failed'],'UNSUPPORTED_FLAG':[b'unknown flag',b'unknown shorthand flag'],'READ_ONLY_FILESYSTEM':[b'read-only file system'],'RESOURCE_LIMIT':[b'out of memory',b'no space left',b'cannot allocate memory'],'NETWORK_OR_TLS':[b'connection refused',b'network is unreachable',b'certificate',b'tls handshake'],'AUTH_OR_RATE_LIMIT':[b'unauthorized',b'denied:',b'too many requests'],'EXEC_OR_RUNTIME':[b'exec format',b'oci runtime',b'failed to create task']}
           return [name for name,patterns in rules.items() if any(x in text for x in patterns)] or ['UNCLASSIFIED_NATIVE_FAILURE']
