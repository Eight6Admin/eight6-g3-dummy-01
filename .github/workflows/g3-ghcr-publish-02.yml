          base.publish = wrap(candidate_publish, 'PUBLISH')
          
          
          def run_mode(mode):
              """Actual instrumented controller, exercised only in isolated dummy fixtures."""
              if mode not in {'prepare', 'publish', 'cleanup'}:
                  return 2
              # Initial telemetry failure must NEVER gate the cleanup body.
              try:
                  if mode == 'prepare':
                      journal().initialize()
                  initial_count = len(journal().read())
              except BaseException:
                  initial_count = None
              try:
                  if mode != 'cleanup' and initial_count is None:
                      raise InvalidJournal('JOURNAL_INVALID')
                  getattr(base, mode)()
                  rows = journal().read()
                  if initial_count is None or len(rows) <= initial_count:
                      raise InvalidJournal('JOURNAL_INVALID')
                  if mode == 'publish':
                      require_publish_success(rows, SAFE_CODES, binding(), initial_count)
                  elif mode == 'cleanup':
                      tail = rows[initial_count:]
                      if [(r['operation'], r['event']) for r in tail] != [('CLEANUP', 'ENTER'), ('CLEANUP', 'EXIT')]:
                          raise InvalidJournal('JOURNAL_INVALID')
                  elif ([r['operation'] for r in rows if r['event']=='ENTER'] != ['PREPARE','VALIDATION','LOCAL_SMOKE','BLOB_VERIFY']
                        or any(r['event']=='FAIL' for r in rows)
                        or [r['return_code'] for r in rows if r['event']=='CHILD_EXIT'] != [0]
                        or rows[-1]['operation'] != 'PREPARE' or rows[-1]['event'] != 'EXIT'):
                      raise InvalidJournal('JOURNAL_INVALID')
