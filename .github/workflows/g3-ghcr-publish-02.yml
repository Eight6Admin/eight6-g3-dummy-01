                      print('FAILURE_CODE=' + code_for(error), flush=True)
                      print('OUTCOME=UNKNOWN_NO_RETRY' if possible else 'OUTCOME=STOP_BEFORE_UPLOAD', flush=True)
                  except BaseException:
                      print('DIAGNOSTIC=UNAVAILABLE_OUTCOME_UNKNOWN_NO_RETRY', flush=True)
                  print('RESULT=NOT_ACCEPTED_STOP_NO_RETRY', flush=True)
                  return 2
              finally:
