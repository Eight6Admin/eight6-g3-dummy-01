name: G3 maintained exact OCI serving-recovery publication 05
on:
  workflow_dispatch:
    inputs:
      release_base64:
        description: Exact independently confirmed operational release bytes in base64
        required: true
        type: string
      release_sha256:
        description: SHA256 of decoded exact operational release
        required: true
        type: string
permissions: {}
concurrency:
  group: eight6-g3-ghcr-exclusive-writer
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Eight6Admin/eight6-g3-dummy-01' && github.actor == 'Eight6Admin' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      RELEASE_BASE64: ${{ inputs.release_base64 }}
      RELEASE_SHA256: ${{ inputs.release_sha256 }}
    steps:
      - name: Start one shared workload and cleanup budget
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I - <<'E6_JOB_BUDGET'
          import os,json,time,pathlib
          os.umask(0o077)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'e6-publisher05-job-budget.json'
          v={'schema':1,'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'started_monotonic':time.monotonic()}
          fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          with os.fdopen(fd,'w') as f:json.dump(v,f);f.flush();os.fsync(f.fileno())
          E6_JOB_BUDGET
      - name: Materialise exact publisher.py part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/publisher.py" <<'E6_SOURCE_0_0'
          
          E6_SOURCE_0_0
      - name: Materialise exact publisher.py part2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode >> "$RUNNER_TEMP/publisher.py" <<'E6_SOURCE_0_1'
          
          E6_SOURCE_0_1
      - name: Materialise exact publisher.py part3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode >> "$RUNNER_TEMP/publisher.py" <<'E6_SOURCE_0_2'
          
          E6_SOURCE_0_2
      - name: Materialise exact publisher.py part4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode >> "$RUNNER_TEMP/publisher.py" <<'E6_SOURCE_0_3'
          
          E6_SOURCE_0_3
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/publisher.py" | /usr/bin/cut -d ' ' -f 1)" = '0b50ea0b844a22481e3ee2268506ff5ecf10bb4bd8049ac31789e5d3736804d3'
      - name: Materialise exact maintained_probe.py part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/maintained_probe.py" <<'E6_SOURCE_1_0'
          
          E6_SOURCE_1_0
      - name: Materialise exact maintained_probe.py part2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode >> "$RUNNER_TEMP/maintained_probe.py" <<'E6_SOURCE_1_1'
          
          E6_SOURCE_1_1
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/maintained_probe.py" | /usr/bin/cut -d ' ' -f 1)" = '161f3237289c08e0ecc5cd6ec3553c78bab015de8a74f787672974a9c4e1da94'
      - name: Materialise exact oci_materialize.py part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/oci_materialize.py" <<'E6_SOURCE_2_0'
          
          E6_SOURCE_2_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/oci_materialize.py" | /usr/bin/cut -d ' ' -f 1)" = '213062f4b6b6b4f1573a3a87b105c4f9a0d4594168b8ed33ec5a7e84a6cd99a0'
      - name: Materialise exact copy_diagnostics.py part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/copy_diagnostics.py" <<'E6_SOURCE_3_0'
          
          E6_SOURCE_3_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/copy_diagnostics.py" | /usr/bin/cut -d ' ' -f 1)" = 'f8830f324eba463201f8f3bb5a9e42c7d7821a209ae97288d878e62bb85d0eeb'
      - name: Materialise exact approved-policy.json part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/approved-policy.json" <<'E6_SOURCE_4_0'
          ewogICAgImRlZmF1bHQiOiBbCiAgICAgICAgewogICAgICAgICAgICAidHlwZSI6ICJpbnNlY3VyZUFjY2VwdEFueXRoaW5nIgogICAgICAgIH0KICAgIF0KfQo=
          E6_SOURCE_4_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/approved-policy.json" | /usr/bin/cut -d ' ' -f 1)" = 'e7b7d97048a60f2e26943f2e307caa6f2000e5836cc1c7cf48ff74452521f084'
      - name: Materialise exact history.json part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/history.json" <<'E6_SOURCE_5_0'
          
          E6_SOURCE_5_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/history.json" | /usr/bin/cut -d ' ' -f 1)" = 'c071589480890d59ebb4c04a5dc8b46ae3fac1602d6c95ca52afdbc9cd2f9ef1'
      - name: Materialise exact PUBLICATION_EXCEPTION_05_PROPOSED.txt part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/PUBLICATION_EXCEPTION_05_PROPOSED.txt" <<'E6_SOURCE_6_0'
          
          E6_SOURCE_6_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/PUBLICATION_EXCEPTION_05_PROPOSED.txt" | /usr/bin/cut -d ' ' -f 1)" = '0bda5a515a8b1deecd26b69ce39ba4859af4d57bd12058d252eecc3a925fee10'
      - name: Materialise exact publication_authority.json part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/publication_authority.json" <<'E6_SOURCE_7_0'
          
          E6_SOURCE_7_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/publication_authority.json" | /usr/bin/cut -d ' ' -f 1)" = '6215cf67c6e7835cfa1bc814d7db7abe854c18f4fb4bf53b3c43c4afccf1014c'
      - name: Materialise exact tests_publisher.py part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/tests_publisher.py" <<'E6_SOURCE_8_0'
          
          E6_SOURCE_8_0
      - name: Materialise exact tests_publisher.py part2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode >> "$RUNNER_TEMP/tests_publisher.py" <<'E6_SOURCE_8_1'
          
          E6_SOURCE_8_1
      - name: Materialise exact tests_publisher.py part3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode >> "$RUNNER_TEMP/tests_publisher.py" <<'E6_SOURCE_8_2'
          
          E6_SOURCE_8_2
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/tests_publisher.py" | /usr/bin/cut -d ' ' -f 1)" = '2ea7d120dd3798edd868fc2824125b43afb3096e4331be1959728471e9495c52'
      - name: Materialise exact bootstrap.py part1
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/base64 --decode > "$RUNNER_TEMP/bootstrap.py" <<'E6_SOURCE_9_0'
          
          E6_SOURCE_9_0
          test "$(/usr/bin/sha256sum "$RUNNER_TEMP/bootstrap.py" | /usr/bin/cut -d ' ' -f 1)" = 'd7b97b475f043c2fc5ec11906934a5456baa1c2a761b862b2bf717ff481f35b6'
      - name: Validate fresh authority and restricted local copy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I "$RUNNER_TEMP/bootstrap.py" prepare
      - name: Bounded credential-free native control regressions before token access
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I "$RUNNER_TEMP/bootstrap.py" dummy
      - name: One authorised maintained-container publication
        env:
          GH_PUBLISH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I "$RUNNER_TEMP/bootstrap.py" publish
      - name: Always close only owned clients and auth data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I "$RUNNER_TEMP/bootstrap.py" cleanup
