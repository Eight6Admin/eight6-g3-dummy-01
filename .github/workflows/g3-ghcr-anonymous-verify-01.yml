name: G3 anonymous exact image verification 01
on:
  workflow_dispatch:
    inputs:
      release_base64:
        description: Exact independently verified non-secret operational release
        required: true
        type: string
      release_sha256:
        description: Exact release SHA256
        required: true
        type: string
permissions: {}
concurrency:
  group: eight6-g3-anonymous-verify-01
  cancel-in-progress: false
jobs:
  verify:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Materialise pinned credential-free helper sources
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I - <<'PY'
          import os,sys,pathlib,json,hashlib,base64,zlib,stat
          keep={k:os.environ[k] for k in ('GITHUB_REPOSITORY','GITHUB_ACTOR','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_RUN_NUMBER','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH','GITHUB_SHA','GITHUB_WORKFLOW_SHA','GITHUB_RUN_ID','RUNNER_TEMP')}
          os.environ.clear();os.environ.update(keep)
          os.umask(0o077)
          root=pathlib.Path(keep['RUNNER_TEMP']).resolve()/('e6-anon-source-'+keep['GITHUB_RUN_ID'])
          root.mkdir(mode=0o700,exist_ok=False)
          pins={'anonymous_read.py': 'D81F12F988B8DB5E690EAA7ED018AB8646A10C58614F9CF78A6D843F99298FA8', 'maintained_probe.py': '62295539FEA3118EBA6EA40E16B5F18EE443520AE7AD72FEEAB522C693EDF0E2', 'copy_diagnostics.py': 'F8830F324EBA463201F8F3BB5A9E42C7D7821A209AE97288D878E62BB85D0EEB', 'approved-policy.json': 'E7B7D97048A60F2E26943F2E307CAA6F2000E5836CC1C7CF48FF74452521F084', 'authority.json': '5790E4A343D3BBDE792F25C5DD63D678F992E8F670092A1A49CED3E1135EDC9D', 'history.json': 'ED4022365BE3916ADC1C8A5ECEC69952F3840E78CBD77A69F52AA0B1FC3F0A80'}
          payload={'maintained_probe.py': '', 'copy_diagnostics.py': '', 'approved-policy.json': 'eNqr5lIAAqWU1LTE0pwSJSuFaLAACFTDWWAlJZUFqUB5pcy84tTk0qJUx+Tk1IISx7zKkozMvHQluOJaMCuWq5YLAANaFoY=', 'authority.json': '', 'history.json': ''}
          for n,b in payload.items():
           raw=zlib.decompress(base64.b64decode(b,validate=True));assert hashlib.sha256(raw).hexdigest().upper()==pins[n]
           with (root/n).open('xb') as f:f.write(raw)
          PY
      - name: Verify complete sources and perform one anonymous read
        shell: bash
        env:
          E6_RELEASE_B64: ${{ inputs.release_base64 }}
          E6_RELEASE_SHA: ${{ inputs.release_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I - <<'PY'
          import os,sys,pathlib,json,hashlib,base64,zlib,stat
          keep={k:os.environ[k] for k in ('GITHUB_REPOSITORY','GITHUB_ACTOR','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_RUN_NUMBER','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH','GITHUB_SHA','GITHUB_WORKFLOW_SHA','GITHUB_RUN_ID','RUNNER_TEMP')}
          release_b64=os.environ['E6_RELEASE_B64'];release_sha=os.environ['E6_RELEASE_SHA']
          os.environ.clear();os.environ.update(keep)
          os.umask(0o077)
          root=pathlib.Path(keep['RUNNER_TEMP']).resolve()/('e6-anon-source-'+keep['GITHUB_RUN_ID'])
          s=root.lstat();assert stat.S_ISDIR(s.st_mode) and not root.is_symlink() and s.st_uid==os.getuid() and stat.S_IMODE(s.st_mode)==0o700
          pins={'anonymous_read.py': 'D81F12F988B8DB5E690EAA7ED018AB8646A10C58614F9CF78A6D843F99298FA8', 'maintained_probe.py': '62295539FEA3118EBA6EA40E16B5F18EE443520AE7AD72FEEAB522C693EDF0E2', 'copy_diagnostics.py': 'F8830F324EBA463201F8F3BB5A9E42C7D7821A209AE97288D878E62BB85D0EEB', 'approved-policy.json': 'E7B7D97048A60F2E26943F2E307CAA6F2000E5836CC1C7CF48FF74452521F084', 'authority.json': '5790E4A343D3BBDE792F25C5DD63D678F992E8F670092A1A49CED3E1135EDC9D', 'history.json': 'ED4022365BE3916ADC1C8A5ECEC69952F3840E78CBD77A69F52AA0B1FC3F0A80'}
          payload={'anonymous_read.py': ''}
          for n,b in payload.items():
           raw=zlib.decompress(base64.b64decode(b,validate=True));assert hashlib.sha256(raw).hexdigest().upper()==pins[n]
           with (root/n).open('xb') as f:f.write(raw)
          assert {p.name for p in root.iterdir()}==set(pins)
          for n,h in pins.items():
           p=root/n;s=p.lstat();assert stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid() and s.st_nlink==1 and hashlib.sha256(p.read_bytes()).hexdigest().upper()==h
          raw=base64.b64decode(release_b64,validate=True);assert len(raw)<=16384 and hashlib.sha256(raw).hexdigest().upper()==release_sha
          r=json.loads(raw);assert r['sources']==pins
          with (root/'release.json').open('xb') as f:f.write(raw)
          os.chdir(root);sys.path[:]=[str(root)]+[p for p in sys.path if p and p!=os.getcwd()]
          import anonymous_read
          raise SystemExit(anonymous_read.main())
          PY
